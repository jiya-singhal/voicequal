[tool.poetry]
name = "voicequal"
version = "0.2.0"
description = "Real-time audio quality assessment for voice apps"
authors = ["Jiya Singhal <jiya.23bcs10043@sst.scaler.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jiya-singhal/voicequal"
repository = "https://github.com/jiya-singhal/voicequal"
keywords = ["audio", "voice", "quality", "noise-detection", "dsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
packages = [{ include = "voicequal", from = "src" }]
include = ["src/voicequal/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
scipy = "^1.11"
soundfile = "^0.12"
rich = "^13.7"
sounddevice = { version = "^0.4", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
ruff = "^0.16.9"
mypy = "^2.3.1"

[tool.poetry.scripts]
voicequal = "voicequal.cli:main"

[tool.poetry.extras]
mic = ["sounddevice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "benchmarks/test_set"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
