[tool.poetry]
name = "voicequal"
version = "0.1.0"
description = "Real-time audio quality assessment for voice apps"
authors = ["Jiya Singhal <jiya.23bcs10043@sst.scaler.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jiya-singhal/voicequal"
repository = "https://github.com/jiya-singhal/voicequal"
keywords = ["audio", "voice", "quality", "noise-detection", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
packages = [{ include = "voicequal", from = "src" }]
include = ["src/voicequal/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
scipy = "^1.11"
soundfile = "^0.12"
rich = "^13.7"
sounddevice = { version = "^0.4", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"

[tool.poetry.scripts]
voicequal = "voicequal.cli:main"

[tool.poetry.extras]
mic = ["sounddevice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
